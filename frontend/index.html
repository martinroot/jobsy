<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jobsy · Агент заказа</title>
<link rel="icon" type="image/png" href="/static/fabra-icon-256.png">
<style>
:root{--bg:#090c11;--panel:#10151d;--line:#242d3b;--text:#f4f7fb;--muted:#7d899c;--accent:#3b82f6;--green:#22c55e}
*{box-sizing:border-box}html,body{width:100%;height:100%;min-height:0;overflow:hidden}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.top{height:56px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 14px;gap:11px;background:#090d13}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px}
.brand img{width:28px;height:28px;border-radius:6px}
.identity{flex:1;min-width:0}
.identity .title{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.identity .sub{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topright{display:flex;align-items:center;gap:8px}
.topbtn{padding:0 8px;font-size:11px;border:1px solid var(--line);border-radius:8px;background:#101a27;color:#c9d8ea;cursor:pointer;text-decoration:none}
.topbtn.green{background:#14331f;border-color:#22c55e;color:#65e7a1}
.usage-chip{display:flex;align-items:center;gap:6px;padding:5px 8px;border:1px solid #2b405b;border-radius:9px;background:#101a27;color:#c9d8ea;font-size:9px;white-space:nowrap}
.usage-chip b{color:#8ff0b4;font-size:10px}
.layout{display:flex;height:calc(100vh - 56px)}
.side{width:320px;border-right:1px solid var(--line);background:#0a0f18;overflow:auto;display:flex;flex-direction:column}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.chatbox{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px}
.row.agent .avatar{order:1}
.row.user{flex-direction:row-reverse}
.avatar{width:28px;height:28px;border-radius:8px;background:#1e2a3a;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.bubble{max-width:70%;padding:8px 12px;border-radius:12px;font-size:13px;line-height:1.45;white-space:pre-wrap}
.row.agent .bubble{background:#162033;border:1px solid #242d3b;color:#e8eef7;border-bottom-left-radius:2px}
.row.user .bubble{background:#2557a1;border:1px solid #3b82f6;color:#fff;border-bottom-right-radius:2px}
.meta{font-size:10px;color:var(--muted);margin:4px 0 0 2px}
.tool{display:flex;align-items:center;gap:8px;margin:6px 0;padding:8px 11px;border:1px solid #2c3d58;border-left:3px solid #5b91ff;border-radius:10px;background:#10192a;color:#c9d8ea;font-size:11px}
.tool.done{border-left-color:#2bb673}
.actions{display:flex;gap:6px;margin:8px 0}
.actions button{padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:#101a27;color:#c9d8ea;cursor:pointer;font-size:12px}
.actions button.primary{background:#3b82f6;border-color:#3b82f6;color:#fff}
.composer{border-top:1px solid var(--line);padding:10px 14px;background:#0a0f18}
.composer-inner{display:flex;gap:8px;align-items:flex-end}
input.text{flex:1;background:#0f1726;border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:#fff;font:inherit}
button.send{background:#3b82f6;border:none;border-radius:10px;padding:8px 18px;color:#fff;font-weight:800;cursor:pointer}
button.send:hover{filter:brightness(1.1)}
.empty{color:var(--muted);font-size:12px;text-align:center;margin-top:40px}
.side h3{font-size:12px;color:var(--muted);margin:14px 14px 8px;text-transform:uppercase;letter-spacing:.04em}
.order-card{border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 14px 14px;background:#0f1726}
.order-card .name{font-weight:800;font-size:13px}
.order-card .meta{font-size:11px;color:var(--muted);margin-top:4px}
.package{margin-top:10px;padding:8px;border:1px solid #2b405b;border-radius:10px;background:#101a27;font-size:11px}
.metrics{grid-template-columns:repeat(3,minmax(0,1fr));display:grid;gap:8px;margin-top:8px}
.metric{background:#0f1726;border:1px solid var(--line);border-radius:8px;padding:8px}
.metric small{color:var(--muted);font-size:10px;display:block}
.metric b{font-size:13px;color:#fff}
hr{border:none;border-top:1px solid var(--line);margin:12px 0}
.hidden{display:none!important}
</style></head><body>
<div class="top">
  <div class="brand"><img src="/static/fabra-icon-256.png" alt=""><div>Jobsy</div></div>
  <div class="identity"><div class="title" id="title">Jobsy Agent</div><div class="sub" id="sub">Чат заказа · агент с инструментами</div></div>
  <div class="topright"><a class="topbtn" href="/">К каталогу</a><span class="topbtn green" id="price"></span><div class="usage-chip" id="headerUsage" hidden><b id="headerTokenCount">0 ток.</b> <span id="headerTokenSplit">in 0 · out 0</span> <span id="headerProviderCost">н/д</span></div></div>
</div>
<div class="layout">
  <div class="side">
    <div class="order-card" id="orderCard" hidden><div class="name" id="orderName"></div><div class="meta" id="orderMeta"></div></div>
    <div class="package" id="packageBox" hidden><div id="packageText"></div></div>
    <div class="metrics" id="usageMetrics"><div class="metric"><small>Время</small><b id="elapsed">—</b></div><div class="metric"><small>Модели</small><b class="usage-models" id="usageModels">—</b></div><div class="metric usage-wide"><small>Сумма</small><b id="usageTotal">—</b></div></div>
    <h3>Сообщения</h3>
    <div id="events" style="flex:1;overflow-y:auto;padding:0 14px;font-size:12px;color:var(--muted)"></div>
  </div>
  <div class="main">
    <div class="chatbox" id="chatbox"></div>
    <div class="empty" id="emptyChat" hidden>Напишите агенту — он начнёт работу над заказом.</div>
    <div class="composer">
      <div class="composer-inner"><input class="text" id="msg" placeholder="Напишите задачу…"><button class="send" id="send">Отправить</button></div>
    </div>
  </div>
</div>
<script src="/static/native-chat.js?v=1"></script>
<script src="/static/agent-native.js?v=1"></script>
</body></html>
