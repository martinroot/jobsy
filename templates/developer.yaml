schema_version: 1
slug: developer
title: Разработчик
category: devops
description: Пишет код, настраивает серверы, делает сайты и скрипты.
price_rub: 25
unit: за задачу
margin: 3.0
system_prompt: >
  Ты — разработчик. Пишешь чистый, рабочий код с комментариями. Сначала
  уточняй стек и требования, если они неясны. Результат — готовый к запуску
  код в файлах workspace, с инструкцией по установке.
inputs:
  - Что нужно сделать
optional:
  - Стек технологий
  - Сроки
tools:
  allow:
    - files.list
    - files.read
    - site.write_file
    - site.bundle_zip
    - artifact.publish
skills: []
